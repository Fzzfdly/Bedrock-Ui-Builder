<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Bedrock JSON-UI Visual Builder</title>
  <style>
    :root {
      --bg-dark: #0f1115;
      --bg-panel: #181b20;
      --bg-card: #21252d;
      --bg-input: #2a303c;
      --border-color: #384152;
      --accent: #00d26a;
      --accent-hover: #00b359;
      --mc-gold: #ffaa00;
      --mc-aqua: #55ffff;
      --mc-red: #ff5555;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Toolbar */
    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      height: 50px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }
    .brand { font-size: 15px; font-weight: 700; color: var(--mc-gold); display: flex; align-items: center; gap: 8px; }
    .toolbar-actions { display: flex; gap: 8px; align-items: center; }

    button.btn {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button.btn:hover { background-color: var(--border-color); }
    button.btn-primary { background-color: var(--accent); color: #000; border-color: var(--accent); }
    button.btn-primary:hover { background-color: var(--accent-hover); }
    button.btn-danger { background-color: rgba(239, 68, 68, 0.2); border-color: var(--mc-red); color: var(--mc-red); }
    button.btn-danger:hover { background-color: var(--mc-red); color: #fff; }

    /* Main Workspace Layout */
    .app-container { display: flex; flex: 1; height: calc(100vh - 50px); overflow: hidden; }

    /* Left Sidebar: Components & File Explorer */
    .sidebar-left {
      width: 260px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); font-weight: 700; }
    
    .component-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .comp-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
    }
    .comp-btn:hover { border-color: var(--accent); background: var(--bg-input); }

    /* File/Element Hierarchy Manager */
    .tree-view {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 4px;
    }
    .tree-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: var(--bg-card);
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .tree-item:hover { border-color: var(--border-color); }
    .tree-item.selected { border-color: var(--mc-aqua); background: #1e2838; }
    .tree-item-actions { display: flex; gap: 4px; }
    .tree-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 4px; font-size: 12px; border-radius: 2px; }
    .tree-action-btn:hover { color: var(--text-main); background: var(--bg-input); }

    /* Center Viewport */
    .viewport {
      flex: 1;
      background-color: #0b0c0e;
      background-image: radial-gradient(#1f242d 1.5px, transparent 1.5px);
      background-size: 18px 18px;
      position: relative;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    #canvas-wrapper {
      position: relative;
      background-color: rgba(0, 0, 0, 0.7);
      border: 2px dashed #444f5c;
      box-shadow: 0 12px 36px rgba(0,0,0,0.85);
      transform-origin: center center;
    }

    /* Canvas UI Elements */
    .ui-element {
      position: absolute;
      box-sizing: border-box;
      cursor: move;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .ui-element.selected {
      outline: 2px solid var(--mc-aqua) !important;
      outline-offset: 1px;
    }

    /* Element Specific Previews */
    .ui-type-panel { background: rgba(30, 41, 59, 0.85); border: 2px solid #64748b; border-radius: 4px; }
    .ui-type-image { background: rgba(51, 65, 85, 0.5); border: 1px dashed #64748b; }
    .ui-type-title { background: #1e293b; color: #fff; font-weight: bold; border-bottom: 2px solid var(--accent); }
    .ui-type-body { background: rgba(15, 23, 42, 0.7); color: #cbd5e1; font-size: 12px; padding: 6px; }
    .ui-type-close { background: #e11d48; color: #fff; font-weight: bold; font-size: 11px; border-radius: 2px; }
    .ui-type-button {
      background: #334155;
      border: 2px solid #475569;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px;
    }
    .ui-type-button .btn-icon { width: 32px; height: 32px; background: #1e293b; border: 1px dashed #64748b; border-radius: 2px; }
    .ui-type-button .btn-label { font-size: 11px; text-align: center; }

    /* Right Sidebar: Property Inspector */
    .sidebar-right {
      width: 320px;
      background-color: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .inspector-header { padding: 12px; border-bottom: 1px solid var(--border-color); font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; }
    .inspector-body { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
    
    .prop-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .prop-card-title { font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); }
    
    .prop-group { display: flex; flex-direction: column; gap: 4px; }
    .prop-group label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .prop-group input[type="text"], 
    .prop-group input[type="number"], 
    .prop-group select {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      user-select: text;
    }
    .prop-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .slider-row { display: flex; align-items: center; gap: 8px; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
    .slider-val { font-size: 11px; font-family: monospace; min-width: 32px; text-align: right; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--bg-panel);
      width: 820px;
      max-height: 88vh;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    textarea.code-box {
      background: #0d1117;
      color: #7ee787;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      resize: vertical;
      height: 180px;
      user-select: text;
    }
  </style>
</head>
<body>

  <!-- Top Toolbar -->
  <header>
    <div class="brand">⛏ Bedrock JSON-UI Builder</div>
    <div class="toolbar-actions">
      <button class="btn" onclick="setPreset(432, 243)">Wide (432x243)</button>
      <button class="btn" onclick="setPreset(350, 200)">Standard (350x200)</button>
      <button class="btn" onclick="setPreset(322, 200)">Compact (322x200)</button>
      <button class="btn" onclick="setPreset(270, 185)">Mini (270x185)</button>
      <button class="btn btn-primary" onclick="openExportModal()">⚡ Export JSON-UI</button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="app-container">

    <!-- Left Sidebar: Controls & Tree Hierarchy -->
    <div class="sidebar-left">
      <div class="sidebar-section">
        <div class="section-title">Add Elements</div>
        <div class="component-grid">
          <button class="comp-btn" onclick="addElement('panel')">🔲 Panel</button>
          <button class="comp-btn" onclick="addElement('image')">🖼 Image</button>
          <button class="comp-btn" onclick="addElement('title')">🏷 Title Bar</button>
          <button class="comp-btn" onclick="addElement('body')">📄 Body Label</button>
          <button class="comp-btn" onclick="addElement('button')">🔘 Action Button</button>
          <button class="comp-btn" onclick="addElement('close')">❌ Close Btn</button>
        </div>
      </div>

      <div class="sidebar-section" style="padding-bottom: 4px;">
        <div class="section-title">Element Hierarchy / Layers</div>
      </div>

      <!-- Live Tree Manager -->
      <div class="tree-view" id="element-tree">
        <!-- Injected via renderTree() -->
      </div>
    </div>

    <!-- Center Canvas Viewport -->
    <div class="viewport" id="viewport">
      <div id="canvas-wrapper" style="width: 432px; height: 243px;">
        <!-- Injected via renderCanvas() -->
      </div>
    </div>

    <!-- Right Sidebar: Properties & Texture Selector -->
    <div class="sidebar-right">
      <div class="inspector-header">
        <span>Property Inspector</span>
        <span id="inspect-id-badge" style="color:var(--text-muted); font-size:11px;">No Selection</span>
      </div>
      <div class="inspector-body" id="inspector-content">
        <p style="font-size: 12px; color: var(--text-muted);">Select an element on canvas or in the layer hierarchy to edit its properties.</p>
      </div>
    </div>

  </div>

  <!-- Export Code Modal -->
  <div class="modal-overlay" id="export-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 14px;">Minecraft Bedrock JSON-UI Output</h3>
        <button class="btn" onclick="closeExportModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="prop-group">
          <label class="section-title">1. UI Namespace File: RP/ui/<span id="out-ns-name">custom_shop</span>.json</label>
          <textarea class="code-box" id="code-namespace" readonly></textarea>
        </div>
        <div class="prop-group">
          <label class="section-title">2. server_form.json (Insert inside controls array)</label>
          <textarea class="code-box" id="code-server-form" style="height: 110px;" readonly></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Builder Script Logic -->
  <script>
    const canvas = document.getElementById('canvas-wrapper');
    const treeView = document.getElementById('element-tree');
    const inspectorContent = document.getElementById('inspector-content');

    let elements = [];
    let selectedId = null;
    let titleFilter = "§fCustom Shop§r";
    let namespace = "custom_shop";
    let buttonCount = 0;

    // Presets for Built-in Textures
    const TEXTURE_PRESETS = [
      { name: "Default Turquoise BG", path: "textures/assets/turquoise_default_background" },
      { name: "Default Turquoise Button", path: "textures/assets/turquoise_default_button" },
      { name: "Turquoise Button Hover", path: "textures/assets/turquoise_hover_button" },
      { name: "Turquoise Title BG", path: "textures/assets/turquoise_default_title_background" },
      { name: "BakaUI Light Button", path: "textures/bakaui/button_light" },
      { name: "BakaUI Dark BG", path: "textures/bakaui/custom_bg_dark" },
      { name: "BakaUI Close Button", path: "textures/bakaui/close_button" },
      { name: "Vanilla Button Black Hover", path: "textures/ui/button_black_hover" },
      { name: "Vanilla Glass Pane", path: "textures/ui/glass_pane" }
    ];

    function setPreset(w, h) {
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      renderCanvas();
    }

    // Add New Element
    function addElement(type) {
      const id = 'el_' + Date.now();
      let newEl = {
        id,
        name: `${type}_${elements.length + 1}`,
        type,
        x: 20,
        y: 20,
        w: 100,
        h: 30,
        layer: type === 'panel' ? 1 : type === 'image' ? 2 : 4,
        alpha: 1.0,
        text: type === 'title' ? '#title_text' : type === 'body' ? '#form_text' : 'Button',
        fontType: 'MinecraftTen',
        fontSize: 1.0,
        shadow: false,
        textAlignment: 'center',
        texture: type === 'button' ? 'textures/assets/turquoise_default_button' : 'textures/assets/turquoise_default_background',
        collectionIndex: type === 'button' ? buttonCount++ : null,
        visible: true
      };

      if (type === 'panel') { newEl.w = 390; newEl.h = 200; newEl.x = 20; newEl.y = 20; }
      if (type === 'title') { newEl.w = 390; newEl.h = 32; newEl.x = 20; newEl.y = 20; newEl.fontSize = 1.5; }
      if (type === 'close') { newEl.w = 16; newEl.h = 16; newEl.x = 390; newEl.y = 26; newEl.text = 'X'; newEl.layer = 10; }
      if (type === 'body') { newEl.w = 350; newEl.h = 24; newEl.x = 40; newEl.y = 60; newEl.textAlignment = 'left'; }
      if (type === 'button') { newEl.w = 80; newEl.h = 95; newEl.x = 30 + (newEl.collectionIndex * 90); newEl.y = 95; }

      elements.push(newEl);
      renderAll();
      selectElement(id);
    }

    // Render Canvas
    function renderCanvas() {
      canvas.innerHTML = '';
      elements.forEach(el => {
        if (!el.visible) return;

        const div = document.createElement('div');
        div.className = `ui-element ui-type-${el.type} ${el.id === selectedId ? 'selected' : ''}`;
        div.style.left = el.x + 'px';
        div.style.top = el.y + 'px';
        div.style.width = el.w + 'px';
        div.style.height = el.h + 'px';
        div.style.opacity = el.alpha;
        div.style.zIndex = el.layer;

        if (el.type === 'button') {
          div.innerHTML = `<div class="btn-icon"></div><div class="btn-label">${el.text} (#${el.collectionIndex})</div>`;
        } else {
          div.innerText = el.text || '';
          div.style.textAlign = el.textAlignment;
        }

        // Mouse Drag Tracking
        div.onmousedown = (e) => {
          e.stopPropagation();
          selectElement(el.id);

          const canvasRect = canvas.getBoundingClientRect();
          const clickOffsetX = e.clientX - (canvasRect.left + el.x);
          const clickOffsetY = e.clientY - (canvasRect.top + el.y);

          function onMouseMove(moveEvent) {
            const curRect = canvas.getBoundingClientRect();
            let newX = moveEvent.clientX - curRect.left - clickOffsetX;
            let newY = moveEvent.clientY - curRect.top - clickOffsetY;

            // Clamping inside the canvas
            newX = Math.max(0, Math.min(canvas.clientWidth - el.w, newX));
            newY = Math.max(0, Math.min(canvas.clientHeight - el.h, newY));

            el.x = Math.round(newX);
            el.y = Math.round(newY);

            div.style.left = el.x + 'px';
            div.style.top = el.y + 'px';
            updateInspectorInputs();
          }

          function onMouseUp() {
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('mouseup', onMouseUp);
          }

          window.addEventListener('mousemove', onMouseMove);
          window.addEventListener('mouseup', onMouseUp);
        };

        canvas.appendChild(div);
      });
    }

    // Render Hierarchy Tree
    function renderTree() {
      treeView.innerHTML = '';
      elements.slice().reverse().forEach(el => {
        const item = document.createElement('div');
        item.className = `tree-item ${el.id === selectedId ? 'selected' : ''}`;
        item.onclick = () => selectElement(el.id);

        item.innerHTML = `
          <span>${el.name} <small style="color:var(--text-muted)">(${el.type})</small></span>
          <div class="tree-item-actions">
            <button class="tree-action-btn" onclick="event.stopPropagation(); moveLayer('${el.id}', 1)">▲</button>
            <button class="tree-action-btn" onclick="event.stopPropagation(); moveLayer('${el.id}', -1)">▼</button>
            <button class="tree-action-btn" onclick="event.stopPropagation(); toggleVisibility('${el.id}')">${el.visible ? '👁' : '🚫'}</button>
          </div>
        `;
        treeView.appendChild(item);
      });
    }

    function moveLayer(id, dir) {
      const idx = elements.findIndex(e => e.id === id);
      if (idx < 0) return;
      const targetIdx = idx + dir;
      if (targetIdx >= 0 && targetIdx < elements.length) {
        const temp = elements[idx];
        elements[idx] = elements[targetIdx];
        elements[targetIdx] = temp;
        renderAll();
      }
    }

    function toggleVisibility(id) {
      const el = elements.find(e => e.id === id);
      if (el) { el.visible = !el.visible; renderAll(); }
    }

    function renderAll() {
      renderCanvas();
      renderTree();
    }

    // Selection & Inspector
    function selectElement(id) {
      selectedId = id;
      renderAll();
      const el = elements.find(e => e.id === id);
      const badge = document.getElementById('inspect-id-badge');

      if (!el) {
        badge.innerText = 'No Selection';
        inspectorContent.innerHTML = `<p style="font-size: 12px; color: var(--text-muted);">Select an element on canvas.</p>`;
        return;
      }

      badge.innerText = `${el.type.toUpperCase()}`;

      inspectorContent.innerHTML = `
        <!-- Identification -->
        <div class="prop-card">
          <div class="prop-card-title">Element Info</div>
          <div class="prop-group">
            <label>Name</label>
            <input type="text" value="${el.name}" onchange="updateProp('name', this.value)">
          </div>
        </div>

        <!-- Transform -->
        <div class="prop-card">
          <div class="prop-card-title">Transform & Position</div>
          <div class="prop-row">
            <div class="prop-group">
              <label>Offset X</label>
              <input type="number" id="inp-x" value="${el.x}" onchange="updateProp('x', +this.value)">
            </div>
            <div class="prop-group">
              <label>Offset Y</label>
              <input type="number" id="inp-y" value="${el.y}" onchange="updateProp('y', +this.value)">
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-group">
              <label>Width</label>
              <input type="number" value="${el.w}" onchange="updateProp('w', +this.value)">
            </div>
            <div class="prop-group">
              <label>Height</label>
              <input type="number" value="${el.h}" onchange="updateProp('h', +this.value)">
            </div>
          </div>
          <div class="prop-group">
            <label>Layer (z-index)</label>
            <input type="number" value="${el.layer}" onchange="updateProp('layer', +this.value)">
          </div>
        </div>

        <!-- Texture Selector -->
        <div class="prop-card">
          <div class="prop-card-title">Texture</div>
          <div class="prop-group">
            <label>Texture Preset</label>
            <select onchange="updateProp('texture', this.value)">
              <option value="">-- Choose Preset --</option>
              ${TEXTURE_PRESETS.map(tp => `<option value="${tp.path}" ${el.texture === tp.path ? 'selected' : ''}>${tp.name}</option>`).join('')}
            </select>
          </div>
          <div class="prop-group">
            <label>Custom Texture Path</label>
            <input type="text" value="${el.texture}" onchange="updateProp('texture', this.value)">
          </div>
          <div class="prop-group">
            <label>Alpha / Opacity</label>
            <div class="slider-row">
              <input type="range" min="0" max="1" step="0.05" value="${el.alpha}" oninput="updateProp('alpha', +this.value); document.getElementById('val-alpha').innerText = this.value;">
              <span class="slider-val" id="val-alpha">${el.alpha}</span>
            </div>
          </div>
        </div>

        <!-- Typography & Text -->
        <div class="prop-card">
          <div class="prop-card-title">Text & Font</div>
          <div class="prop-group">
            <label>Label / Variable</label>
            <input type="text" value="${el.text}" onchange="updateProp('text', this.value)">
          </div>
          <div class="prop-row">
            <div class="prop-group">
              <label>Font Type</label>
              <select onchange="updateProp('fontType', this.value)">
                <option value="MinecraftTen" ${el.fontType === 'MinecraftTen' ? 'selected' : ''}>MinecraftTen</option>
                <option value="MinecraftRegular" ${el.fontType === 'MinecraftRegular' ? 'selected' : ''}>MinecraftRegular</option>
              </select>
            </div>
            <div class="prop-group">
              <label>Alignment</label>
              <select onchange="updateProp('textAlignment', this.value)">
                <option value="center" ${el.textAlignment === 'center' ? 'selected' : ''}>Center</option>
                <option value="left" ${el.textAlignment === 'left' ? 'selected' : ''}>Left</option>
                <option value="right" ${el.textAlignment === 'right' ? 'selected' : ''}>Right</option>
              </select>
            </div>
          </div>
          <div class="prop-group">
            <label>Font Scale Factor</label>
            <div class="slider-row">
              <input type="range" min="0.5" max="3.0" step="0.1" value="${el.fontSize}" oninput="updateProp('fontSize', +this.value); document.getElementById('val-font').innerText = this.value;">
              <span class="slider-val" id="val-font">${el.fontSize}</span>
            </div>
          </div>
          <div class="toggle-row">
            <label>Text Shadow</label>
            <input type="checkbox" ${el.shadow ? 'checked' : ''} onchange="updateProp('shadow', this.checked)">
          </div>
        </div>

        ${el.collectionIndex !== null ? `
          <!-- Collection Details -->
          <div class="prop-card">
            <div class="prop-card-title">ActionForm Binding</div>
            <div class="prop-group">
              <label>Button Collection Index</label>
              <input type="number" value="${el.collectionIndex}" onchange="updateProp('collectionIndex', +this.value)">
            </div>
          </div>
        ` : ''}

        <button class="btn btn-danger" style="margin-top: 6px;" onclick="deleteSelected()">🗑 Delete Element</button>
      `;
    }

    function updateProp(prop, val) {
      const el = elements.find(e => e.id === selectedId);
      if (!el) return;
      el[prop] = val;
      renderAll();
    }

    function updateInspectorInputs() {
      const el = elements.find(e => e.id === selectedId);
      if (!el) return;
      const ix = document.getElementById('inp-x');
      const iy = document.getElementById('inp-y');
      if (ix && iy) { ix.value = el.x; iy.value = el.y; }
    }

    function deleteSelected() {
      elements = elements.filter(e => e.id !== selectedId);
      selectedId = null;
      renderAll();
      selectElement(null);
    }

    // Export Generation Logic
    function openExportModal() {
      const namespaceJson = {
        "namespace": namespace,
        "custom_button": {
          "type": "panel",
          "$button_size|default": [64, 64],
          "$icon_size|default": [32, 32],
          "size": "$button_size",
          "controls": [
            {
              "form_button@common_buttons.light_text_button": {
                "$pressed_button_name": "button.form_button_click",
                "size": "$button_size",
                "$button_text": "#form_button_text",
                "$button_text_binding_type": "collection",
                "$button_text_grid_collection_name": "form_buttons",
                "bindings": [
                  { "binding_type": "collection_details", "binding_collection_name": "form_buttons" }
                ]
              }
            }
          ]
        },
        [namespace]: {
          "type": "panel",
          "size": [canvas.clientWidth, canvas.clientHeight],
          "controls": elements.map((el, i) => {
            if (el.type === 'button') {
              return {
                [`btn_${el.collectionIndex}@${namespace}.custom_button`]: {
                  "offset": [el.x, el.y],
                  "$button_size": [el.w, el.h],
                  "collection_index": el.collectionIndex,
                  "layer": el.layer,
                  "anchor_from": "top_left",
                  "anchor_to": "top_left"
                }
              };
            }
            if (el.type === 'title') {
              return {
                [`title_bar_${i}`]: {
                  "type": "label",
                  "offset": [el.x, el.y],
                  "size": [el.w, el.h],
                  "layer": el.layer,
                  "text": "#title_text",
                  "font_type": el.fontType,
                  "font_scale_factor": el.fontSize,
                  "text_alignment": el.textAlignment,
                  "shadow": el.shadow,
                  "bindings": [{ "binding_name": "#title_text" }]
                }
              };
            }
            return {
              [`elem_${i}`]: {
                "type": el.type === 'image' ? 'image' : 'panel',
                "size": [el.w, el.h],
                "offset": [el.x, el.y],
                "layer": el.layer,
                "alpha": el.alpha,
                ...(el.texture ? { "texture": el.texture } : {}),
                "anchor_from": "top_left",
                "anchor_to": "top_left"
              }
            };
          })
        }
      };

      const serverFormSnippet = {
        [`${namespace}_panel@${namespace}.${namespace}`]: {
          "layer": 2,
          "bindings": [
            { "binding_name": "#title_text" },
            {
              "binding_type": "view",
              "source_property_name": `(not((#title_text - '${titleFilter}') = #title_text))`,
              "target_property_name": "#visible"
            }
          ]
        }
      };

      document.getElementById('out-ns-name').innerText = namespace;
      document.getElementById('code-namespace').value = JSON.stringify(namespaceJson, null, 2);
      document.getElementById('code-server-form').value = JSON.stringify(serverFormSnippet, null, 2);
      document.getElementById('export-modal').style.display = 'flex';
    }

    function closeExportModal() {
      document.getElementById('export-modal').style.display = 'none';
    }
  </script>
</body>
</html>
