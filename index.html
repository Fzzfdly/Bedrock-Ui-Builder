<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Bedrock JSON-UI Studio</title>
  <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08090c;
      --bg-panel: #12141a;
      --bg-card: #1a1e26;
      --bg-input: #242a36;
      --border-color: #313a4a;
      --accent: #00d26a;
      --accent-hover: #00b359;
      --mc-gold: #ffaa00;
      --mc-aqua: #55ffff;
      --mc-red: #ff5555;
      --text-main: #f3f4f6;
      --text-muted: #8a94a4;
      --grid-size: 8px;
      --zoom-scale: 1.6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }
    .brand { font-size: 15px; font-weight: 700; color: var(--mc-gold); display: flex; align-items: center; gap: 8px; font-family: 'Minecraft', monospace; }
    .toolbar-actions { display: flex; gap: 8px; align-items: center; }

    button.btn {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button.btn:hover { background-color: var(--border-color); }
    button.btn-primary { background-color: var(--accent); color: #000; border-color: var(--accent); }
    button.btn-primary:hover { background-color: var(--accent-hover); }
    button.btn-danger { background-color: rgba(239, 68, 68, 0.2); border-color: var(--mc-red); color: var(--mc-red); }
    button.btn-danger:hover { background-color: var(--mc-red); color: #fff; }

    .control-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .control-pill select {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 11px;
    }

    /* Workspace */
    .app-container { display: flex; flex: 1; height: calc(100vh - 52px); overflow: hidden; }

    /* Left Sidebar */
    .sidebar-left {
      width: 260px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); font-weight: 700; }
    
    .component-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .comp-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
    }
    .comp-btn:hover { border-color: var(--accent); background: var(--bg-input); }

    .tree-view {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 4px;
    }
    .tree-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: var(--bg-card);
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .tree-item:hover { border-color: var(--border-color); }
    .tree-item.selected { border-color: var(--mc-aqua); background: #192330; }
    .tree-item-actions { display: flex; gap: 4px; }
    .tree-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 4px; font-size: 12px; border-radius: 2px; }
    .tree-action-btn:hover { color: var(--text-main); background: var(--bg-input); }

    /* Center Viewport */
    .viewport {
      flex: 1;
      background-color: #050608;
      position: relative;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    #canvas-wrapper {
      position: relative;
      background-color: #101114;
      box-shadow: 0 20px 60px rgba(0,0,0,0.95);
      touch-action: none;
      transform: scale(var(--zoom-scale));
      transform-origin: center center;
      image-rendering: pixelated;
    }

    #canvas-wrapper.grid-on {
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
    }

    /* Canvas UI Elements */
    .ui-element {
      position: absolute;
      box-sizing: border-box;
      cursor: move;
      touch-action: none;
      image-rendering: pixelated;
    }

    .ui-element.selected {
      outline: 1.5px solid var(--mc-aqua) !important;
      outline-offset: 1px;
    }

    /* Independent Texture Background Layer */
    .ui-bg-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      image-rendering: pixelated;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* Content Layer (Solid 100% Text & Icon Opacity) */
    .ui-content-layer {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }

    /* Minecraft Fonts */
    .mc-font-ten { font-family: 'Minecraft', monospace; font-weight: 700; letter-spacing: 0.5px; }
    .mc-font-regular { font-family: 'Minecraft', monospace; font-weight: 400; }

    /* Button Structure */
    .btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 100%;
      height: 100%;
      padding: 4px;
    }

    .btn-icon {
      width: 30px;
      height: 30px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      image-rendering: pixelated;
    }

    /* Resize Handles */
    .resize-handle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--mc-aqua);
      border: 1px solid #000;
      z-index: 99;
      pointer-events: auto;
    }
    .handle-nw { top: -4px; left: -4px; cursor: nwse-resize; }
    .handle-ne { top: -4px; right: -4px; cursor: nesw-resize; }
    .handle-se { bottom: -4px; right: -4px; cursor: nwse-resize; }
    .handle-sw { bottom: -4px; left: -4px; cursor: nesw-resize; }
    .handle-n  { top: -4px; left: calc(50% - 4px); cursor: ns-resize; }
    .handle-s  { bottom: -4px; left: calc(50% - 4px); cursor: ns-resize; }
    .handle-w  { top: calc(50% - 4px); left: -4px; cursor: ew-resize; }
    .handle-e  { top: calc(50% - 4px); right: -4px; cursor: ew-resize; }

    /* Right Sidebar: Inspector */
    .sidebar-right {
      width: 320px;
      background-color: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .inspector-header { padding: 12px; border-bottom: 1px solid var(--border-color); font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; }
    .inspector-body { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
    
    .prop-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .prop-card-title { font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); }
    
    .prop-group { display: flex; flex-direction: column; gap: 4px; }
    .prop-group label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .prop-group input[type="text"], 
    .prop-group input[type="number"], 
    .prop-group select {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      user-select: text;
    }
    .prop-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .prop-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; }
    
    .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .slider-row { display: flex; align-items: center; gap: 8px; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
    .slider-val { font-size: 11px; font-family: monospace; min-width: 32px; text-align: right; }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--bg-panel);
      width: 820px;
      max-height: 88vh;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    textarea.code-box {
      background: #0d1117;
      color: #7ee787;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      resize: vertical;
      height: 180px;
      user-select: text;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">⛏ Bedrock JSON-UI Studio</div>
    <div class="toolbar-actions">
      <!-- Zoom Scale Dropdown -->
      <div class="control-pill">
        <span>Zoom</span>
        <select id="sel-zoom" onchange="setZoomScale(+this.value)">
          <option value="1.0">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="1.6" selected>160% (Default)</option>
          <option value="1.8">180%</option>
          <option value="2.0">200%</option>
        </select>
      </div>

      <!-- Grid Snap Selection -->
      <div class="control-pill">
        <label><input type="checkbox" id="chk-grid" checked onchange="toggleGrid(this.checked)"> Grid Snap</label>
        <select id="sel-grid-size" onchange="setGridSize(+this.value)">
          <option value="2">2px</option>
          <option value="4">4px</option>
          <option value="8" selected>8px</option>
          <option value="16">16px</option>
        </select>
      </div>

      <button class="btn" onclick="setPreset(432, 243)">Wide (432x243)</button>
      <button class="btn" onclick="setPreset(350, 200)">Standard (350x200)</button>
      <button class="btn" onclick="setPreset(322, 200)">Compact (322x200)</button>
      <button class="btn" onclick="setPreset(270, 185)">Mini (270x185)</button>
      <button class="btn" onclick="openPreviewModal()">🔍 Preview JSON</button>
      <button class="btn btn-primary" onclick="openExportModal()">⚡ Export JSON-UI</button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="app-container">

    <!-- Left Sidebar: Controls & Tree Hierarchy -->
    <div class="sidebar-left">
      <div class="sidebar-section">
        <div class="section-title">Add Elements</div>
        <div class="component-grid">
          <button class="comp-btn" onclick="addElement('panel')">🔲 Panel</button>
          <button class="comp-btn" onclick="addElement('image')">🖼 Image</button>
          <button class="comp-btn" onclick="addElement('title')">🏷 Title Bar</button>
          <button class="comp-btn" onclick="addElement('button')">🔘 Action Button</button>
          <button class="comp-btn" onclick="addElement('close')">❌ Close Btn</button>
        </div>
      </div>

      <div class="sidebar-section" style="padding-bottom: 4px;">
        <div class="section-title">Hierarchy & Layers</div>
      </div>

      <div class="tree-view" id="element-tree"></div>
    </div>

    <!-- Center Viewport -->
    <div class="viewport" id="viewport">
      <div id="canvas-wrapper" class="grid-on" style="width: 350px; height: 200px;"></div>
    </div>

    <!-- Right Sidebar: Properties & Texture Selector -->
    <div class="sidebar-right">
      <div class="inspector-header">
        <span>Property Inspector</span>
        <span id="inspect-id-badge" style="color:var(--text-muted); font-size:11px;">No Selection</span>
      </div>
      <div class="inspector-body" id="inspector-content">
        <p style="font-size: 12px; color: var(--text-muted);">Select an element on canvas to modify properties.</p>
      </div>
    </div>

  </div>

  <!-- Live JSON Preview Modal -->
  <div class="modal-overlay" id="preview-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 14px;">Live JSON Preview</h3>
        <button class="btn" onclick="closePreviewModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="prop-group">
          <label class="section-title">Active Namespace Hierarchy</label>
          <textarea class="code-box" id="code-preview" style="height: 360px;" readonly></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Export Code Modal -->
  <div class="modal-overlay" id="export-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 14px;">Minecraft Bedrock JSON-UI Output</h3>
        <button class="btn" onclick="closeExportModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="prop-group">
          <label class="section-title">1. UI Namespace File: RP/ui/<span id="out-ns-name">custom_shop</span>.json</label>
          <textarea class="code-box" id="code-namespace" readonly></textarea>
        </div>
        <div class="prop-group">
          <label class="section-title">2. server_form.json (Insert inside long_form.controls array)</label>
          <textarea class="code-box" id="code-server-form" style="height: 110px;" readonly></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas-wrapper');
    const treeView = document.getElementById('element-tree');
    const inspectorContent = document.getElementById('inspector-content');

    let elements = [];
    let selectedId = null;
    let titleFilter = "§fCustom Shop§r";
    let namespace = "custom_shop";
    let buttonCount = 0;

    let zoomScale = 1.6;
    let gridSnap = true;
    let gridSize = 8;

    // Complete Minecraft Bedrock § Color Table
    const MC_COLORS = [
      { code: "§0", name: "§0 Black", hex: "#000000" },
      { code: "§1", name: "§1 Dark Blue", hex: "#0000aa" },
      { code: "§2", name: "§2 Dark Green", hex: "#00aa00" },
      { code: "§3", name: "§3 Dark Aqua", hex: "#00aaaa" },
      { code: "§4", name: "§4 Dark Red", hex: "#aa0000" },
      { code: "§5", name: "§5 Dark Purple", hex: "#aa00aa" },
      { code: "§6", name: "§6 Gold", hex: "#ffaa00" },
      { code: "§7", name: "§7 Gray", hex: "#aaaaaa" },
      { code: "§8", name: "§8 Dark Gray", hex: "#555555" },
      { code: "§9", name: "§9 Blue", hex: "#5555ff" },
      { code: "§a", name: "§a Green", hex: "#55ff55" },
      { code: "§b", name: "§b Aqua", hex: "#55ffff" },
      { code: "§c", name: "§c Red", hex: "#ff5555" },
      { code: "§d", name: "§d Light Purple", hex: "#ff55ff" },
      { code: "§e", name: "§e Yellow", hex: "#ffff55" },
      { code: "§f", name: "§f White", hex: "#ffffff" },
      { code: "§g", name: "§g Minecoin Gold", hex: "#ddd605" }
    ];

    const TEXTURE_PRESETS = [
      { name: "Button Light", path: "textures/bakaui/button_light" },
      { name: "Button Light Hover", path: "textures/bakaui/button_lighthover" },
      { name: "Button Light Pressed", path: "textures/bakaui/button_lightpressed" },
      { name: "Custom BG Divider", path: "textures/bakaui/custom_bg_divider" },
      { name: "Custom BG Dark", path: "textures/bakaui/custom_bg_dark" },
      { name: "Custom BG Black", path: "textures/bakaui/custom_bg" },
      { name: "Close Button", path: "textures/bakaui/close_button" },
      { name: "Close Button Hover", path: "textures/bakaui/close_button_hover" }
    ];

    function setZoomScale(val) {
      zoomScale = val;
      document.documentElement.style.setProperty('--zoom-scale', val);
    }

    function toggleGrid(enabled) {
      gridSnap = enabled;
      canvas.classList.toggle('grid-on', enabled);
    }

    function setGridSize(size) {
      gridSize = size;
      document.documentElement.style.setProperty('--grid-size', size + 'px');
    }

    function setPreset(w, h) {
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      renderCanvas();
    }

    function snap(val) {
      if (!gridSnap) return Math.round(val);
      return Math.round(val / gridSize) * gridSize;
    }

    async function autoFetchNineSlice(el) {
      if (!el.texture) return;
      try {
        const res = await fetch(`${el.texture}.json`);
        if (res.ok) {
          const data = await res.json();
          const ns = data.nineslice_size;
          if (ns !== undefined) {
            if (typeof ns === 'number') {
              el.sliceTop = el.sliceRight = el.sliceBottom = el.sliceLeft = ns;
            } else if (Array.isArray(ns)) {
              if (ns.length === 4) {
                el.sliceLeft = ns[0];
                el.sliceTop = ns[1];
                el.sliceRight = ns[2];
                el.sliceBottom = ns[3];
              } else if (ns.length === 2) {
                el.sliceLeft = el.sliceRight = ns[0];
                el.sliceTop = el.sliceBottom = ns[1];
              }
            }
            el.useNineSlice = true;
            renderCanvas();
            updateInspector();
          }
        }
      } catch (err) {}
    }

    function addElement(type) {
      const id = 'el_' + Date.now();
      let newEl = {
        id,
        name: `${type}_${elements.length + 1}`,
        type,
        x: 16,
        y: 16,
        w: 96,
        h: 32,
        layer: type === 'panel' ? 1 : type === 'image' ? 2 : 4,
        alpha: 1.0,
        text: type === 'title' ? 'Menu Title' : type === 'button' ? 'Button' : '',
        fontType: 'MinecraftTen',
        fontSize: 1.0,
        textColor: type === 'button' ? '#000000' : '#ffffff',
        mcColorCode: type === 'button' ? '§0' : '§f',
        shadow: true,
        textAlignment: 'center',
        texture: type === 'button' ? 'textures/bakaui/button_light' : type === 'close' ? 'textures/bakaui/close_button' : 'textures/bakaui/custom_bg_dark',
        iconTexture: 'textures/bakaui/trash',
        collectionIndex: type === 'button' ? buttonCount++ : null,
        useNineSlice: type === 'button' || type === 'panel',
        sliceTop: 4,
        sliceRight: 4,
        sliceBottom: 4,
        sliceLeft: 4,
        visible: true
      };

      if (type === 'panel') { newEl.w = 320; newEl.h = 180; newEl.x = 16; newEl.y = 10; }
      if (type === 'title') { newEl.w = 320; newEl.h = 24; newEl.x = 16; newEl.y = 10; newEl.fontSize = 1.2; newEl.useNineSlice = false; }
      if (type === 'close') { newEl.w = 14; newEl.h = 14; newEl.x = 320; newEl.y = 14; newEl.layer = 64; newEl.useNineSlice = false; }
      if (type === 'button') { newEl.w = 64; newEl.h = 64; newEl.x = 32 + (newEl.collectionIndex * 72); newEl.y = 80; }

      newEl.x = snap(newEl.x);
      newEl.y = snap(newEl.y);
      newEl.w = snap(newEl.w);
      newEl.h = snap(newEl.h);

      elements.push(newEl);
      autoFetchNineSlice(newEl);
      renderAll();
      selectElement(id);
    }

    function renderCanvas() {
      canvas.innerHTML = '';
      elements.forEach(el => {
        if (!el.visible) return;

        const div = document.createElement('div');
        div.id = el.id;
        div.className = `ui-element ui-type-${el.type} ${el.id === selectedId ? 'selected' : ''}`;
        div.style.left = el.x + 'px';
        div.style.top = el.y + 'px';
        div.style.width = el.w + 'px';
        div.style.height = el.h + 'px';
        div.style.zIndex = el.layer;
        div.style.color = el.textColor || '#ffffff';

        // 1. Independent Background Texture Layer
        const bgLayer = document.createElement('div');
        bgLayer.className = 'ui-bg-layer';
        bgLayer.style.opacity = el.alpha;

        if (el.useNineSlice && el.texture) {
          const t = el.sliceTop || 4;
          const r = el.sliceRight || 4;
          const b = el.sliceBottom || 4;
          const l = el.sliceLeft || 4;

          bgLayer.style.borderStyle = 'solid';
          bgLayer.style.borderWidth = `${t}px ${r}px ${b}px ${l}px`;
          bgLayer.style.borderImageSource = `url('${el.texture}.png')`;
          bgLayer.style.borderImageSlice = `${t} ${r} ${b} ${l} fill`;
          bgLayer.style.borderImageRepeat = 'stretch';
          bgLayer.style.backgroundImage = 'none';
        } else if (el.texture) {
          bgLayer.style.borderStyle = 'none';
          bgLayer.style.borderWidth = '0px';
          bgLayer.style.borderImageSource = 'none';
          bgLayer.style.backgroundImage = `url('${el.texture}.png')`;
        }
        div.appendChild(bgLayer);

        // 2. Content Layer (Solid 100% Text & Icon Opacity)
        const contentLayer = document.createElement('div');
        contentLayer.className = 'ui-content-layer';

        const fontClass = el.fontType === 'MinecraftTen' ? 'mc-font-ten' : 'mc-font-regular';
        const shadowStyle = el.shadow ? 'text-shadow: 1px 1px 0px rgba(0,0,0,0.85);' : '';

        if (el.type === 'button') {
          contentLayer.innerHTML = `
            <div class="btn-container">
              <div class="btn-icon" style="background-image: url('${el.iconTexture || 'textures/bakaui/trash'}.png');"></div>
              <div class="${fontClass}" style="font-size:${11 * el.fontSize}px; ${shadowStyle}">${el.text}</div>
            </div>
          `;
        } else if (el.type === 'title') {
          contentLayer.innerHTML = `<span class="${fontClass}" style="font-size:${12 * el.fontSize}px; ${shadowStyle}">${el.text || ''}</span>`;
          contentLayer.style.justifyContent = el.textAlignment === 'left' ? 'flex-start' : el.textAlignment === 'right' ? 'flex-end' : 'center';
        } else if (el.type === 'close') {
          contentLayer.innerHTML = `<span style="font-size: 9px; font-weight: bold;">✕</span>`;
        }
        div.appendChild(contentLayer);

        // 3. Resize Handles on Active Selection
        if (el.id === selectedId) {
          ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].forEach(dir => {
            const handle = document.createElement('div');
            handle.className = `resize-handle handle-${dir}`;
            handle.dataset.dir = dir;

            handle.onpointerdown = (e) => {
              e.stopPropagation();
              const startMouseX = e.clientX;
              const startMouseY = e.clientY;
              const origX = el.x;
              const origY = el.y;
              const origW = el.w;
              const origH = el.h;

              function onResizeMove(moveEv) {
                const deltaX = (moveEv.clientX - startMouseX) / zoomScale;
                const deltaY = (moveEv.clientY - startMouseY) / zoomScale;

                let nextX = origX;
                let nextY = origY;
                let nextW = origW;
                let nextH = origH;

                if (dir.includes('e')) nextW = Math.max(gridSize, snap(origW + deltaX));
                if (dir.includes('s')) nextH = Math.max(gridSize, snap(origH + deltaY));
                if (dir.includes('w')) {
                  const snappedW = Math.max(gridSize, snap(origW - deltaX));
                  nextX = origX + (origW - snappedW);
                  nextW = snappedW;
                }
                if (dir.includes('n')) {
                  const snappedH = Math.max(gridSize, snap(origH - deltaY));
                  nextY = origY + (origH - snappedH);
                  nextH = snappedH;
                }

                el.x = nextX;
                el.y = nextY;
                el.w = nextW;
                el.h = nextH;

                div.style.left = el.x + 'px';
                div.style.top = el.y + 'px';
                div.style.width = el.w + 'px';
                div.style.height = el.h + 'px';

                updateInspectorCoordinates();
              }

              function onResizeUp() {
                window.removeEventListener('pointermove', onResizeMove);
                window.removeEventListener('pointerup', onResizeUp);
                renderAll();
              }

              window.addEventListener('pointermove', onResizeMove);
              window.addEventListener('pointerup', onResizeUp);
            };

            div.appendChild(handle);
          });
        }

        // 4. Element Drag Movement via Window Listeners
        div.onpointerdown = (e) => {
          if (e.target.classList.contains('resize-handle')) return;

          e.stopPropagation();
          setActiveSelection(el.id);

          const startMouseX = e.clientX;
          const startMouseY = e.clientY;
          const startElemX = el.x;
          const startElemY = el.y;

          function onDragMove(moveEvent) {
            const deltaX = (moveEvent.clientX - startMouseX) / zoomScale;
            const deltaY = (moveEvent.clientY - startMouseY) / zoomScale;

            let nextX = snap(startElemX + deltaX);
            let nextY = snap(startElemY + deltaY);

            nextX = Math.max(0, Math.min(canvas.clientWidth - el.w, nextX));
            nextY = Math.max(0, Math.min(canvas.clientHeight - el.h, nextY));

            el.x = nextX;
            el.y = nextY;

            div.style.left = el.x + 'px';
            div.style.top = el.y + 'px';

            updateInspectorCoordinates();
          }

          function onDragUp() {
            window.removeEventListener('pointermove', onDragMove);
            window.removeEventListener('pointerup', onDragUp);
            renderAll();
          }

          window.addEventListener('pointermove', onDragMove);
          window.addEventListener('pointerup', onDragUp);
        };

        canvas.appendChild(div);
      });
    }

    function renderTree() {
      treeView.innerHTML = '';
      elements.slice().reverse().forEach(el => {
        const item = document.createElement('div');
        item.className = `tree-item ${el.id === selectedId ? 'selected' : ''}`;
        item.onclick = () => selectElement(el.id);

        item.innerHTML = `
          <span>${el.name} <small style="color:var(--text-muted)">(${el.type})</small></span>
          <div class="tree-item-actions">
            <button class="tree-action-btn" onclick="event.stopPropagation(); moveLayer('${el.id}', 1)">▲</button>
            <button class="tree-action-btn" onclick="event.stopPropagation(); moveLayer('${el.id}', -1)">▼</button>
            <button class="tree-action-btn" onclick="event.stopPropagation(); toggleVisibility('${el.id}')">${el.visible ? '👁' : '🚫'}</button>
          </div>
        `;
        treeView.appendChild(item);
      });
    }

    function moveLayer(id, dir) {
      const idx = elements.findIndex(e => e.id === id);
      if (idx < 0) return;
      const targetIdx = idx + dir;
      if (targetIdx >= 0 && targetIdx < elements.length) {
        const temp = elements[idx];
        elements[idx] = elements[targetIdx];
        elements[targetIdx] = temp;
        renderAll();
      }
    }

    function toggleVisibility(id) {
      const el = elements.find(e => e.id === id);
      if (el) { el.visible = !el.visible; renderAll(); }
    }

    function renderAll() {
      renderCanvas();
      renderTree();
    }

    function setActiveSelection(id) {
      selectedId = id;
      document.querySelectorAll('.ui-element').forEach(node => {
        node.classList.toggle('selected', node.id === id);
      });
      renderTree();
      updateInspector();
    }

    function selectElement(id) {
      selectedId = id;
      renderAll();
      updateInspector();
    }

    function updateTextColor(val) {
      const el = elements.find(e => e.id === selectedId);
      if (!el) return;
      const matched = MC_COLORS.find(c => c.hex.toLowerCase() === val.toLowerCase());
      if (matched) {
        el.textColor = matched.hex;
        el.mcColorCode = matched.code;
      }
      renderAll();
      updateInspector();
    }

    function updateInspector() {
      const el = elements.find(e => e.id === selectedId);
      const badge = document.getElementById('inspect-id-badge');

      if (!el) {
        badge.innerText = 'No Selection';
        inspectorContent.innerHTML = `<p style="font-size: 12px; color: var(--text-muted);">Select an element on canvas.</p>`;
        return;
      }

      badge.innerText = `${el.type.toUpperCase()}`;

      // Only Button and Title Bar allow Label / Typography Editing
      let textCardHtml = '';
      if (el.type === 'button' || el.type === 'title') {
        textCardHtml = `
          <div class="prop-card">
            <div class="prop-card-title">${el.type === 'button' ? 'Button Label' : 'ActionForm Title'}</div>
            <div class="prop-group">
              <label>${el.type === 'button' ? 'Button Text' : 'Title Text'}</label>
              <input type="text" value="${el.text}" onchange="updateProp('text', this.value)">
            </div>
            <div class="prop-group">
              <label>Minecraft Color Code (§)</label>
              <select onchange="updateTextColor(this.value)">
                ${MC_COLORS.map(c => `<option value="${c.hex}" ${el.textColor.toLowerCase() === c.hex.toLowerCase() ? 'selected' : ''} style="color:${c.hex}; background:#1a1e26; font-weight:bold;">${c.name}</option>`).join('')}
              </select>
            </div>
            <div class="prop-row">
              <div class="prop-group">
                <label>Font Type</label>
                <select onchange="updateProp('fontType', this.value)">
                  <option value="MinecraftTen" ${el.fontType === 'MinecraftTen' ? 'selected' : ''}>MinecraftTen</option>
                  <option value="MinecraftRegular" ${el.fontType === 'MinecraftRegular' ? 'selected' : ''}>MinecraftRegular</option>
                </select>
              </div>
              <div class="prop-group">
                <label>Alignment</label>
                <select onchange="updateProp('textAlignment', this.value)">
                  <option value="center" ${el.textAlignment === 'center' ? 'selected' : ''}>Center</option>
                  <option value="left" ${el.textAlignment === 'left' ? 'selected' : ''}>Left</option>
                  <option value="right" ${el.textAlignment === 'right' ? 'selected' : ''}>Right</option>
                </select>
              </div>
            </div>
            <div class="prop-row">
              <div class="prop-group">
                <label>Font Scale</label>
                <input type="number" step="0.1" value="${el.fontSize}" onchange="updateProp('fontSize', +this.value)">
              </div>
              <div class="toggle-row" style="margin-top: 18px;">
                <label>Text Shadow</label>
                <input type="checkbox" ${el.shadow ? 'checked' : ''} onchange="updateProp('shadow', this.checked)">
              </div>
            </div>
          </div>
        `;
      }

      inspectorContent.innerHTML = `
        <div class="prop-card">
          <div class="prop-card-title">Element Info</div>
          <div class="prop-group">
            <label>Name</label>
            <input type="text" value="${el.name}" onchange="updateProp('name', this.value)">
          </div>
        </div>

        <div class="prop-card">
          <div class="prop-card-title">Transform & Dimensions</div>
          <div class="prop-row">
            <div class="prop-group">
              <label>Offset X</label>
              <input type="number" id="inp-x" value="${el.x}" onchange="updateProp('x', snap(+this.value))">
            </div>
            <div class="prop-group">
              <label>Offset Y</label>
              <input type="number" id="inp-y" value="${el.y}" onchange="updateProp('y', snap(+this.value))">
            </div>
          </div>
          <div class="prop-row">
            <div class="prop-group">
              <label>Width</label>
              <input type="number" id="inp-w" value="${el.w}" onchange="updateProp('w', snap(+this.value))">
            </div>
            <div class="prop-group">
              <label>Height</label>
              <input type="number" id="inp-h" value="${el.h}" onchange="updateProp('h', snap(+this.value))">
            </div>
          </div>
          <div class="prop-group">
            <label>Layer (z-index)</label>
            <input type="number" value="${el.layer}" onchange="updateProp('layer', +this.value)">
          </div>
        </div>

        <div class="prop-card">
          <div class="prop-card-title">Texture & 9-Slice</div>
          <div class="prop-group">
            <label>BakaUI Preset</label>
            <select onchange="updateTexturePreset(this.value)">
              <option value="">-- Choose Texture --</option>
              ${TEXTURE_PRESETS.map(tp => `<option value="${tp.path}" ${el.texture === tp.path ? 'selected' : ''}>${tp.name}</option>`).join('')}
            </select>
          </div>
          <div class="prop-group">
            <label>Custom Texture Path</label>
            <input type="text" value="${el.texture}" onchange="updateTexturePreset(this.value)">
          </div>

          ${el.type === 'button' ? `
            <div class="prop-group">
              <label>Button Icon (Default: trash.png)</label>
              <input type="text" value="${el.iconTexture || 'textures/bakaui/trash'}" onchange="updateProp('iconTexture', this.value)">
            </div>
          ` : ''}
          
          <div class="toggle-row" style="margin-top: 4px;">
            <label>Enable 9-Slice Border</label>
            <input type="checkbox" ${el.useNineSlice ? 'checked' : ''} onchange="updateProp('useNineSlice', this.checked)">
          </div>

          ${el.useNineSlice ? `
            <div class="prop-group">
              <label>Slice Insets (Top / Right / Bottom / Left)</label>
              <div class="prop-row-4">
                <input type="number" title="Top" value="${el.sliceTop}" onchange="updateProp('sliceTop', +this.value)">
                <input type="number" title="Right" value="${el.sliceRight}" onchange="updateProp('sliceRight', +this.value)">
                <input type="number" title="Bottom" value="${el.sliceBottom}" onchange="updateProp('sliceBottom', +this.value)">
                <input type="number" title="Left" value="${el.sliceLeft}" onchange="updateProp('sliceLeft', +this.value)">
              </div>
            </div>
          ` : ''}

          <div class="prop-group">
            <label>Texture Opacity (Text Remains 100% Solid)</label>
            <div class="slider-row">
              <input type="range" min="0" max="1" step="0.05" value="${el.alpha}" oninput="updateProp('alpha', +this.value); document.getElementById('val-alpha').innerText = this.value;">
              <span class="slider-val" id="val-alpha">${el.alpha}</span>
            </div>
          </div>
        </div>

        ${textCardHtml}

        ${el.collectionIndex !== null ? `
          <div class="prop-card">
            <div class="prop-card-title">ActionForm Binding</div>
            <div class="prop-group">
              <label>Button Collection Index</label>
              <input type="number" value="${el.collectionIndex}" onchange="updateProp('collectionIndex', +this.value)">
            </div>
          </div>
        ` : ''}

        <button class="btn btn-danger" style="margin-top: 6px;" onclick="deleteSelected()">🗑 Delete Element</button>
      `;
    }

    function updateTexturePreset(path) {
      const el = elements.find(e => e.id === selectedId);
      if (!el) return;
      el.texture = path;
      autoFetchNineSlice(el);
      renderAll();
      updateInspector();
    }

    function updateProp(prop, val) {
      const el = elements.find(e => e.id === selectedId);
      if (!el) return;
      el[prop] = val;
      renderAll();
    }

    function updateInspectorCoordinates() {
      const el = elements.find(e => e.id === selectedId);
      if (!el) return;
      const ix = document.getElementById('inp-x');
      const iy = document.getElementById('inp-y');
      const iw = document.getElementById('inp-w');
      const ih = document.getElementById('inp-h');
      if (ix) ix.value = el.x;
      if (iy) iy.value = el.y;
      if (iw) iw.value = el.w;
      if (ih) ih.value = el.h;
    }

    function deleteSelected() {
      elements = elements.filter(e => e.id !== selectedId);
      selectedId = null;
      renderAll();
      updateInspector();
    }

    function generateNamespaceJson() {
      return {
        "namespace": namespace,
        "custom_button": {
          "type": "panel",
          "$button_size|default": [64, 64],
          "$icon_size|default": [32, 32],
          "size": "$button_size",
          "controls": [
            {
              "form_button@common_buttons.light_text_button": {
                "$pressed_button_name": "button.form_button_click",
                "size": "$button_size",
                "$button_text": "#form_button_text",
                "$button_text_binding_type": "collection",
                "$button_text_grid_collection_name": "form_buttons",
                "bindings": [
                  { "binding_type": "collection_details", "binding_collection_name": "form_buttons" }
                ]
              }
            }
          ]
        },
        [namespace]: {
          "type": "panel",
          "size": [canvas.clientWidth, canvas.clientHeight],
          "controls": elements.map((el, i) => {
            if (el.type === 'button') {
              return {
                [`btn_${el.collectionIndex}@${namespace}.custom_button`]: {
                  "offset": [el.x, el.y],
                  "$button_size": [el.w, el.h],
                  "collection_index": el.collectionIndex,
                  "layer": el.layer,
                  "anchor_from": "top_left",
                  "anchor_to": "top_left"
                }
              };
            }
            if (el.type === 'title') {
              return {
                [`title_bar_${i}`]: {
                  "type": "label",
                  "offset": [el.x, el.y],
                  "size": [el.w, el.h],
                  "layer": el.layer,
                  "text": "#title_text",
                  "font_type": el.fontType,
                  "font_scale_factor": el.fontSize,
                  "text_alignment": el.textAlignment,
                  "shadow": el.shadow,
                  "bindings": [{ "binding_name": "#title_text" }]
                }
              };
            }
            return {
              [`elem_${i}`]: {
                "type": el.type === 'image' ? 'image' : 'panel',
                "size": [el.w, el.h],
                "offset": [el.x, el.y],
                "layer": el.layer,
                "alpha": el.alpha,
                ...(el.texture ? { "texture": el.texture } : {}),
                "anchor_from": "top_left",
                "anchor_to": "top_left"
              }
            };
          })
        }
      };
    }

    function openPreviewModal() {
      const json = generateNamespaceJson();
      document.getElementById('code-preview').value = JSON.stringify(json, null, 2);
      document.getElementById('preview-modal').style.display = 'flex';
    }

    function closePreviewModal() {
      document.getElementById('preview-modal').style.display = 'none';
    }

    function openExportModal() {
      const namespaceJson = generateNamespaceJson();

      const serverFormSnippet = {
        [`${namespace}_panel@${namespace}.${namespace}`]: {
          "layer": 2,
          "bindings": [
            { "binding_name": "#title_text" },
            {
              "binding_type": "view",
              "source_property_name": `(not((#title_text - '${titleFilter}') = #title_text))`,
              "target_property_name": "#visible"
            }
          ]
        }
      };

      document.getElementById('out-ns-name').innerText = namespace;
      document.getElementById('code-namespace').value = JSON.stringify(namespaceJson, null, 2);
      document.getElementById('code-server-form').value = JSON.stringify(serverFormSnippet, null, 2);
      document.getElementById('export-modal').style.display = 'flex';
    }

    function closeExportModal() {
      document.getElementById('export-modal').style.display = 'none';
    }
  </script>
</body>
</html>
